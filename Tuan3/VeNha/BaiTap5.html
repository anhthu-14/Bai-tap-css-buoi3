
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khoa CNTTKD</title>

    <!-- Nhúng thư viện Font Awesome 5 Free -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        /* Định dạng chung */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Căn giữa toàn bộ nội dung */
        .best-shared {
            text-align: center;
        }

        /* Định dạng logo */
        .logo {
            margin: 8px 0 15px;
        }

        .logo img {
            width: 200px;
        }

        /* Định dạng tiêu đề */
        h2 {
            font-size: 40px;
            font-weight: normal;
            margin: 15px 0 20px;
        }

        h2 strong {
            color: #03a9f4;
        }

        /* Định dạng icon trong tiêu đề */
        h2 i {
            color: #03a9f4;
            font-size: 34px;
            margin-right: 10px;
        }

        /* Định dạng đoạn mô tả */
        .lead-text {
            font-size: 14px;
            margin-bottom: 35px;
        }

        .lead-text i {
            color: #03a9f4;
            margin-right: 6px;
        }

        /* Định dạng danh sách nút */
        .btn-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .btn-list li {
            display: inline-block;
            margin: 0 10px;
        }

        /* Định dạng các nút */
        .btn-list a {
            display: inline-block;
            background-color: #2d3032;
            color: white;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Định dạng icon trong nút */
        .btn-list a i {
            margin-right: 8px;
            font-size: 15px;
        }

    </style>
</head>

<body>

    <section class="best-shared">

        <p class="logo">
            <img src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png" alt="">
        </p>

        <h2>
            <i class="fas fa-server"></i>
            Best <strong>Shared Hosting</strong> Company
        </h2>

        <p class="lead-text">
            <i class="fas fa-globe"></i>
            With this responsive landing page template, you can promote your all hosting, domain and email services.
        </p>

        <ul class="btn-list">
            <li>
                <a href="./">
                    <i class="fas fa-tags"></i>
                    View Plans
                </a>
            </li>

            <li>
                <a href="./">
                    <i class="fas fa-list-alt"></i>
                    All Features
                </a>
            </li>
        </ul>

    </section>

</body>
</html>
