
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bài tập HTML CSS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            font-size: 20px;
            background: white;
        }

        /* Chữ wrapper */
        .wrapper-title {
            width: 300px;
            margin: 0 auto 5px;
            padding-left: 7px;
        }

        /* Lớp nền trắng bên ngoài */
        .wrapper-outer {
            width: 306px;
            height: 341px;
            margin: 0 auto;
            padding: 5px;
            background: white;

            box-shadow: -12px 12px 18px rgba(0, 0, 0, 0.35);
        }

        /* Khung wrapper */
        #wrapper {
            width: 100%;
            height: 100%;
            padding: 6px;
            border: 3px solid black;

            display: grid;
            grid-template-columns: 19% 1fr;
            grid-template-rows: 50px 1fr 35px;
            gap: 5px;
        }

        header {
            grid-column: 1 / 3;
            border: 3px solid black;
            padding: 7px;
        }

        nav {
            border: 3px solid black;
            padding: 7px;
        }

        main {
            border: 3px solid black;
            padding: 7px;
        }

        footer {
            grid-column: 1 / 3;
            border: 3px solid black;
            padding: 5px;
        }
    </style>
</head>

<body>

    <div class="wrapper-title">
        wrapper
    </div>

    <div class="wrapper-outer">

        <div id="wrapper">

            <header>header</header>

            <nav>nav</nav>

            <main>main</main>

            <footer>footer</footer>

        </div>

    </div>

</body>
</html>
